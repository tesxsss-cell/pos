name: Deploy Incremental via SSH ke Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, rsync, dan migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source terbaru dari GitHub
        uses: actions/checkout@v4

      # Mendeteksi apakah ada perubahan pada folder migrations atau seeders
      - name: Cek perubahan file Database (Migration / Seeder)
        id: db_changes
        uses: dorny/paths-filter@v3
        with:
          filters:
            db:
              - 'database/migrations/**'
              - 'database/seeders/**'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instal dependensi frontend
        run: npm ci

      - name: Build Tailwind CSS dan JavaScript
        run: npm run build

      - name: Pastikan hasil build tersedia
        run: test -f public/build/manifest.json

      - name: Hapus penanda Vite development
        run: rm -f public/hot

      # Sinkronisasi file via rsync (Password SSH)
      - name: Sinkronisasi file via rsync
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || '21098' }}" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='.env*' \
            --exclude='.phpactor.json' \
            --exclude='.phpunit.result.cache' \
            --exclude='.codex/' \
            --exclude='.cursor/' \
            --exclude='.idea/' \
            --exclude='.nova/' \
            --exclude='.phpunit.cache/' \
            --exclude='.vscode/' \
            --exclude='.zed/' \
            --exclude='auth.json' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='_ide_helper.php' \
            --exclude='/public/fonts-manifest.dev.json' \
            --exclude='/public/hot' \
            --exclude='/public/storage' \
            --exclude='/storage/*.key' \
            --exclude='/storage/pail/' \
            --exclude='/storage/logs/' \
            --exclude='/storage/framework/cache/' \
            --exclude='/storage/framework/sessions/' \
            --exclude='/storage/framework/views/' \
            --exclude='/storage/app/' \
            --exclude='/bootstrap/cache/' \
            --exclude='Homestead.json' \
            --exclude='Homestead.yaml' \
            --exclude='Thumbs.db' \
            --exclude='/tests/' \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_APP_PATH || '/home/clouyogf/public_html/pos' }}

      - name: Jalankan Perintah di Server via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_CHANGED: ${{ steps.db_changes.outputs.db }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '21098' }}
          envs: DB_CHANGED
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="${{ secrets.SSH_APP_PATH }}"

            if [ -z "$APP_DIR" ]; then
              for CANDIDATE in "$HOME/public_html/pos" "$HOME/public_html"; do
                if [ -f "$CANDIDATE/artisan" ]; then
                  APP_DIR="$CANDIDATE"
                  break
                fi
              done
            fi

            if [ -z "$APP_DIR" ]; then
              ARTISAN_FILE="$(find "$HOME/public_html" -maxdepth 4 -type f -name artisan -print -quit 2>/dev/null || true)"
              if [ -n "$ARTISAN_FILE" ]; then
                APP_DIR="$(dirname "$ARTISAN_FILE")"
              fi
            fi

            if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/artisan" ]; then
              echo "ERROR: Folder aplikasi Laravel tidak ditemukan."
              echo "Isi GitHub Secret SSH_APP_PATH dengan path folder yang berisi file artisan."
              exit 1
            fi

            echo "Aplikasi Laravel ditemukan di: $APP_DIR"
            cd "$APP_DIR"

            # 1. Bersihkan cache konfigurasi lama
            php artisan optimize:clear

            # 2. Cek apakah ada perubahan file migration atau seeder
            if [ "$DB_CHANGED" = "true" ]; then
              echo ">> Terdeteksi perubahan migration/seeder: Menjalankan migrate:fresh --seed..."
              php artisan migrate:fresh --seed --force --no-interaction
            else
              echo ">> Tidak ada perubahan skema database: Menjalankan migrate biasa..."
              php artisan migrate --force --no-interaction
            fi

            # 3. Cache konfigurasi, route, dan view untuk optimasi produksi
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo ">> Deployment selesai sukses!"