name: Deploy2 via FTP ke Namecheap

# Otomatis setiap push ke main; bisa juga dijalankan manual dari tab "Actions".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-ftp-produksi
  cancel-in-progress: true

jobs:
  deploy:
    name: Build di GitHub lalu upload via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      # Server FTP tidak bisa menjalankan composer/artisan/npm,
      # jadi aset Vite di-build di sini dulu lalu diupload.
      - name: Siapkan .env sementara untuk proses build
        run: cp .env.example .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'   # SAMAKAN dengan versi PHP di hosting (cPanel > MultiPHP Manager)

    

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build asset Tailwind/Vite
        run: |
          npm ci
          npm run build

       - name: Upload ke hosting via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21

          # Memberi waktu lebih panjang untuk operasi FTP besar.
          timeout: 300000

          # Agar log berikutnya menampilkan penyebab detail sebelum koneksi ditutup.
          log-level: verbose

          local-dir: ./
          server-dir: ./

          # File/folder yang TIDAK ikut diupload:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            vendor/**
            **/vendor/**
            .env
            .env.*
            bootstrap/cache/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/app/**
            tests/**