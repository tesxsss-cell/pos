name: Deployy via FTP ke Namecheap

# Otomatis setiap push ke main; bisa juga dijalankan manual dari tab "Actions".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-ftp-produksi
  cancel-in-progress: true

jobs:
  deploy:
    name: Build di GitHub lalu upload via FTP
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4


      - name: Upload ke hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}       # mis. ftp.domainanda.com atau hostname/IP server
          username: ${{ secrets.FTP_USERNAME }}   # akun utama atau akun FTP khusus
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                          # coba ftps dulu. Jika gagal handshake, ganti ke ftp
          port: 21
          local-dir: ./
          server-dir: ./
          # File/folder yang TIDAK ikut diupload:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            vendor/**
            **/vendor/**
            .env
            .env.*
            bootstrap/cache/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/app/**
            tests/**