name: Deploy Incremental via FTPS ke Namecheap

# Jalan otomatis saat ada push ke main, atau jalankan manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cegah dua deploy menulis ke folder production secara bersamaan.
concurrency:
  group: deploy-pos-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sinkronkan file yang berubah saja
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source terbaru dari GitHub
        uses: actions/checkout@v4

      # File .ftp-deploy-sync-state.json disimpan di server.
      # Setelah satu deploy berhasil, hanya file baru/berubah yang akan diupload.
      - name: Upload perubahan via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 300000
          log-level: standard

          # Akun FTP khusus harus memiliki root:
          # /home/clouyogf/public_html/pos
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json

          # Pola .gitignore proyek + file runtime yang tidak boleh ditimpa.
          # Jangan masukkan .ftp-deploy-sync-state.json ke daftar ini.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**

            *.log
            **/*.log
            .DS_Store
            **/.DS_Store
            .env
            .env.backup
            .env.production
            .phpactor.json
            .phpunit.result.cache
            .codex/**
            .cursor/**
            .idea/**
            .nova/**
            .phpunit.cache/**
            .vscode/**
            .zed/**
            auth.json

            node_modules/**
            **/node_modules/**
            vendor/**
            **/vendor/**
            _ide_helper.php
            **/_ide_helper.php

            public/build/**
            public/fonts-manifest.dev.json
            public/hot
            public/hot/**
            public/storage
            public/storage/**

            storage/*.key
            storage/pail/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/app/**

            bootstrap/cache/**
            Homestead.json
            **/Homestead.json
            Homestead.yaml
            **/Homestead.yaml
            Thumbs.db
            **/Thumbs.db
            tests/**
