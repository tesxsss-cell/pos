name: Deploy Incremental via SSH (rsync) ke Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pos-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, rsync, dan migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil source terbaru dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instal dependensi frontend
        run: npm ci

      - name: Build Tailwind CSS dan JavaScript
        run: npm run build

      - name: Pastikan hasil build tersedia
        run: test -f public/build/manifest.json

      - name: Hapus penanda Vite development
        run: rm -f public/hot

      - name: Sinkronisasi file ke server via rsync (SSH)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '21098' }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "./"
          TARGET: ${{ secrets.SSH_APP_PATH || '/home/clouyogf/public_html/pos' }}
          EXCLUDES: |
            /.git/
            /.github/
            /*.log
            /**/*.log
            .DS_Store
            **/.DS_Store
            .env
            .env.*
            .phpactor.json
            .phpunit.result.cache
            .codex/
            .cursor/
            .idea/
            .nova/
            .phpunit.cache/
            .vscode/
            .zed/
            auth.json
            /node_modules/
            /vendor/
            _ide_helper.php
            /public/fonts-manifest.dev.json
            /public/hot
            /public/storage
            /storage/*.key
            /storage/pail/
            /storage/logs/
            /storage/framework/cache/
            /storage/framework/sessions/
            /storage/framework/views/
            /storage/app/
            /bootstrap/cache/
            Homestead.json
            Homestead.yaml
            Thumbs.db
            /tests/

      - name: Jalankan migration dan optimasi Laravel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '21098' }}
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="${{ secrets.SSH_APP_PATH }}"

            if [ -z "$APP_DIR" ]; then
              for CANDIDATE in "$HOME/public_html/pos" "$HOME/public_html"; do
                if [ -f "$CANDIDATE/artisan" ]; then
                  APP_DIR="$CANDIDATE"
                  break
                fi
              done
            fi

            if [ -z "$APP_DIR" ]; then
              ARTISAN_FILE="$(find "$HOME/public_html" -maxdepth 4 -type f -name artisan -print -quit 2>/dev/null || true)"
              if [ -n "$ARTISAN_FILE" ]; then
                APP_DIR="$(dirname "$ARTISAN_FILE")"
              fi
            fi

            if [ -z "$APP_DIR" ] || [ ! -f "$APP_DIR/artisan" ]; then
              echo "ERROR: Folder aplikasi Laravel tidak ditemukan."
              echo "Isi GitHub Secret SSH_APP_PATH dengan path folder yang berisi file artisan."
              exit 1
            fi

            echo "Aplikasi Laravel ditemukan di: $APP_DIR"
            cd "$APP_DIR"

            php artisan migrate --force --no-interaction
            php artisan optimize:clear